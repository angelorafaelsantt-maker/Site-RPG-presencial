j9nRHws+if8AeI/5BU/Uv++n8K+r6vRxgh6Ufrn/ALsS/iP+tc26x/dv+NfV9XbA74H/2Q==');background-size:200% 100%;background-position:left center;display:flex;align-items:center;justify-content:center;padding:clamp(15px,4vw,60px);transform-origin:left center;transition:transform .65s ease,opacity .65s;backface-visibility:hidden}.page.textpage{background-position:right center}.page.turn{transform:perspective(1400px) rotateY(-90deg);opacity:0;pointer-events:none}.sheet{width:min(850px,88vw);max-height:78dvh;overflow:auto;text-align:center;padding:clamp(14px,3vw,36px);background:#f4e5c633;border:1px solid #71513555;border-radius:12px}.sheet h1{font-size:clamp(25px,4vw,52px);margin:0 0 15px}.sheet p{font-size:clamp(16px,2.2vw,25px);line-height:1.55}.portrait{height:min(62dvh,650px);width:min(65vw,650px);object-fit:contain;filter:drop-shadow(0 7px 8px #37221388)}.placeholder{font-size:clamp(90px,18vw,240px)}.controls{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:4;background:#342115d9;padding:8px;border-radius:12px;color:#f9e5bd}button{cursor:pointer;background:#78502d;color:#fff1d3;border:1px solid #c7a06d;border-radius:7px;padding:10px 16px;font-family:Georgia,serif;font-size:15px}button:disabled{opacity:.35;cursor:default}dialog{border:5px double #815c35;background:#eee0bd;color:#332217;max-width:min(600px,92vw);padding:24px}dialog::backdrop{background:#120b07c9}input,textarea{width:100%;padding:9px;margin:5px 0 12px;border:1px solid #a68b65;background:#fff8e8;font:16px Georgia}textarea{min-height:75px}#editor{max-height:85dvh;overflow:auto}#editor label{display:block;font-weight:bold}#editorButtons{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:13px}.top{position:absolute;z-index:5;top:10px;right:10px}
#gate{position:fixed;inset:0;z-index:100;background:#24170fe8;display:grid;place-items:center;padding:20px}#gate .sheet{background:#e7d1a4;max-height:90vh}#gate input{display:block}#editor{max-height:88vh;overflow:auto}#adminBtn{position:absolute;top:12px;right:12px;z-index:9}#status{position:absolute;top:12px;left:12px;z-index:8;background:#392518;color:#f4dcb2;padding:9px;border-radius:6px}.sheet{max-width:min(900px,86vw)}.portrait{height:min(63dvh,650px)}#message{color:#a2261c}#editFields label{display:block;text-align:left}#editFields input,#editFields textarea{width:100%}</style></head><body><main id="app"><div id="status"></div><button id="adminBtn" style="display:none" onclick="openEditor()">⚙ Editar personagens</button><section id="page" class="page"><article class="sheet" id="sheet"></article></section><div class="controls"><button onclick="move(-1)">◀ Anterior</button><span id="counter"></span><button onclick="move(1)">Próxima ▶</button></div></main><div id="gate"><div class="sheet"><h1>✦ Livro dos Destinos ✦</h1><p>Entre para descobrir seu destino</p><div id="loginFields"><input id="username" placeholder="Nome de usuário" autocomplete="username"><input id="password" type="password" placeholder="Senha" autocomplete="current-password"></div><div id="tokenField" style="display:none"><input id="token" placeholder="Código de configuração do mestre"></div><p id="message"></p><button onclick="auth('login')">Entrar</button><button onclick="auth('register')">Criar conta de jogador</button><button onclick="showMasterSetup()">Primeiro acesso do mestre</button></div></div><dialog id="confirm"><h2>Confirmar personagem?</h2><p>Depois de confirmar, este personagem ficará reservado para você e indisponível para outros jogadores.</p><button onclick="confirm.close()">Voltar</button><button onclick="choose()">Confirmar escolha</button></dialog><dialog id="story"><h2 id="storyTitle"></h2><h3>História</h3><p id="history"></p><h3>Relações</h3><p id="relations"></p><h3>Pertences</h3><p id="items"></p><button onclick="story.close()">Fechar</button></dialog><dialog id="editor"><h2>Editor do mestre</h2><select id="pick" onchange="fillEditor()"></select><div id="editFields"></div><p id="reservation"></p><button onclick="saveCharacter()">Salvar</button><button onclick="addCharacter()">Adicionar</button><button onclick="releaseCharacter()">Liberar reserva</button><button onclick="deleteCharacter()">Excluir</button><button onclick="editor.close()">Fechar</button></dialog><script>
let user=null,chars=[],pageNum=0;const $=id=>document.getElementById(id);const fields=['name','personality','history','relations','items','image'];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,method='GET',body){let r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let data=await r.json();if(!r.ok)throw Error(data.error||'Erro');return data}async function refresh(){chars=await api('/api/characters');pageNum=Math.min(pageNum,Math.max(0,chars.length*2-1));render()}function render(){let c=chars[Math.floor(pageNum/2)];$('status').textContent=user?user.username+' · '+(user.role==='master'?'Mestre':'Jogador'):'';if(!c){$('sheet').innerHTML='<h1>Nenhum personagem cadastrado</h1>';return}let image=pageNum%2===0;$('page').className='page '+(image?'':'textpage');let reserved=c.reserved&&!c.mine;let flag=c.reserved?(c.mine?'Seu personagem':'Indisponível'): 'Disponível';$('sheet').innerHTML=image?'<h1>'+esc(c.name)+'</h1>'+(c.image?'<img class="portrait" src="'+esc(c.image)+'" alt="Personagem">':'<div class="placeholder">✦</div>')+'<p>'+flag+'</p>':'<h1>'+esc(c.name)+'</h1><h2>Personalidade</h2><p>'+esc(c.personality)+'</p><p>'+flag+'</p>'+(c.mine||user.role==='master'?'<button onclick="showStory()">Ler história</button>':!reserved?'<button onclick="confirm.showModal()">Escolher este personagem</button>':'');$('counter').textContent='Página '+(pageNum+1)+' de '+chars.length*2}function move(d){let n=pageNum+d;if(n<0||n>=chars.length*2)return;$('page').classList.add('turn');setTimeout(()=>{pageNum=n;render()},290)}async function choose(){try{await api('/api/choose/'+chars[Math.floor(pageNum/2)].id,'POST');confirm.close();await refresh();showStory()}catch(e){confirm.close();alert(e.message);await refresh()}}function showStory(){let c=chars[Math.floor(pageNum/2)];$('storyTitle').textContent=c.name;for(let k of ['history','relations','items'])$(k).textContent=c[k]||'';story.showModal()}function showMasterSetup(){$('tokenField').style.display='block';$('message').textContent='Defina MASTER_SETUP_TOKEN no servidor antes de criar o mestre.'}async function auth(mode){try{let a={username:$('username').value,password:$('password').value};if(mode==='setup'){a.token=$('token').value}await api(mode==='login'?'/api/login':mode==='register'?'/api/register':'/api/setup-master','POST',a);await start()}catch(e){$('message').textContent=e.message}}$('token').addEventListener('keydown',e=>{if(e.key==='Enter')auth('setup')});$('tokenField').insertAdjacentHTML('beforeend','<button onclick="auth('setup')">Criar mestre</button>');async function start(){user=await api('/api/me');if(!user)return;$('gate').style.display='none';$('adminBtn').style.display=user.role==='master'?'block':'none';await refresh()}function openEditor(){if(user.role!=='master')return;pick.innerHTML=chars.map((c,i)=>'<option value="'+i+'">'+esc(c.name)+'</option>').join('');fillEditor();editor.showModal()}function fillEditor(){let c=chars[+pick.value];if(!c)return;$('editFields').innerHTML=fields.map(k=>'<label>'+k+'<textarea id="field_'+k+'">'+esc(c[k])+'</textarea></label>').join('')+'<label>Enviar imagem <input id="upload" type="file" accept="image/*"></label>';$('reservation').textContent=c.reserved?'Reservado por: '+c.owner_name:'Disponível'}async function values(){let a={};for(let k of fields)a[k]=$('field_'+k).value;let f=$('upload').files[0];if(f){if(f.size>900000)throw Error('Use uma imagem de até 900 KB.');a.image=await new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}return a}async function saveCharacter(){try{let c=chars[+pick.value];await api('/api/admin/characters/'+c.id,'PUT',await values());await refresh();openEditor()}catch(e){alert(e.message)}}async function addCharacter(){try{await api('/api/admin/characters','POST',{name:'Novo personagem'});await refresh();openEditor();pick.value=chars.length-1;fillEditor()}catch(e){alert(e.message)}}async function releaseCharacter(){let c=chars[+pick.value];if(!c||!window.confirm('Liberar este personagem?'))return;await api('/api/admin/release/'+c.id,'POST');await refresh();openEditor()}async function deleteCharacter(){let c=chars[+pick.value];if(!c||!window.confirm('Excluir personagem?'))return;await api('/api/admin/characters/'+c.id,'DELETE');await refresh();openEditor()}start().catch(()=>{});
</script></body></html>
